# Comprueba tipos, estilo y pruebas en cada cambio que llega a GitHub.
# El resultado se ve en la pestaña Actions del repositorio.
name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:

# Solo lectura: esta comprobación no necesita escribir en el repositorio.
permissions:
  contents: read

jobs:
  comprobar:
    name: Tipos, estilo y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Estilo
        run: npm run lint
      - name: Pruebas
        run: npm test -- --ci
