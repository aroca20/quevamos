# Comprueba la app y el servidor en cada cambio que llega a GitHub.
# El resultado se ve en la pestaña Actions del repositorio.
name: Comprobaciones

on:
  push:
    branches: [main]
  pull_request:

# Solo lectura: estas comprobaciones no necesitan escribir en el repositorio.
permissions:
  contents: read

jobs:
  comprobar:
    name: App
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Estilo
        run: npm run lint
      - name: Pruebas
        run: npm test -- --ci

  servidor:
    name: Servidor
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: servidor
    # PostgreSQL de verdad para las pruebas, además de PGlite.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: quevamos_pruebas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL_PRUEBAS: postgres://postgres:postgres@localhost:5432/quevamos_pruebas
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: servidor/package-lock.json
      - name: Instalar dependencias
        run: npm ci
      - name: Tipos
        run: npm run typecheck
      - name: Estilo
        run: npm run lint
      - name: Pruebas con PGlite y PostgreSQL
        run: npm test
      - name: Compilación
        run: npm run build
